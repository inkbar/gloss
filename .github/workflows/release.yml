name: release

# Publishing a release builds the tag it names and publishes gloss-format
# to npm. release-please.yml publishes the release when its release PR is
# merged.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Build the tag the release names, not whatever main happens to be.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The tag reaches the shell through env, not interpolation: a tag name may
      # legally contain shell metacharacters.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag $TAG is not a version tag"; exit 1 ;;
          esac
          v=$(jq -r .version packages/gloss-format/package.json)
          if [ "v$v" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match gloss-format ($v)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # pnpm skips a version already on the registry, so a rerun is safe. The
      # package trusts this workflow on npm, so pnpm exchanges the job's OIDC
      # token for a short-lived publish token and no npm token is stored in the
      # repository.
      - name: Publish
        run: pnpm --filter gloss-format publish --access public --provenance --no-git-checks
