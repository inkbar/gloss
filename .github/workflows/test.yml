name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; main runs every push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site imports gloss-format from its dist/, so lint and typecheck need it built.
      - run: pnpm --filter gloss-format build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # pnpm -r builds gloss-format before the site that depends on it.
      - run: pnpm build
      - run: test -f site/dist/schema/v1.json
      - run: pnpm test
